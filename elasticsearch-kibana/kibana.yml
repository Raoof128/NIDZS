# ======================== Kibana Configuration =========================
#
# Network IDS Kibana Configuration
# SIEM & Threat Hunting Interface
#
# ---------------------------------- Server ------------------------------------
server.name: kibana
server.host: "0.0.0.0"
server.port: 5601

# -------------------------------- Elasticsearch -------------------------------
elasticsearch.hosts: ["http://elasticsearch:9200"]
elasticsearch.username: "elastic"
elasticsearch.password: "changeme"

# Elasticsearch request timeout
elasticsearch.requestTimeout: 90000
elasticsearch.shardTimeout: 120000

# ---------------------------------- Security ----------------------------------
xpack.security.enabled: true
xpack.encryptedSavedObjects.encryptionKey: "fhjskloppd678ehkdfdlliverpoolfcr32"

# -------------------------------- Monitoring ----------------------------------
monitoring.ui.enabled: true
monitoring.kibana.collection.enabled: false

# ---------------------------------- Logging -----------------------------------
logging.dest: stdout
logging.json: false
logging.quiet: false
logging.verbose: false

# --------------------------------- Telemetry ----------------------------------
telemetry.enabled: false
telemetry.optIn: false

# -------------------------------- Saved Objects -------------------------------
savedObjects.maxImportPayloadBytes: 26214400

# ----------------------------------- Maps -------------------------------------
map.includeElasticMapsService: true

# -------------------------------- Dashboards ----------------------------------
# Enable dark mode by default
uiSettings.overrides.theme:darkMode: false

# -------------------------------- IDS-Specific --------------------------------
# Custom branding for Network IDS
newsfeed.enabled: false
xpack.reporting.enabled: true
