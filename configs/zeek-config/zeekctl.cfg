# ZeekControl Configuration
# Management and operational settings

# Installation paths
ZeekPort = 47760
ZeekScriptDir = /opt/zeek/share/zeek/site

# Logs
LogDir = /opt/zeek/logs
LogRotationInterval = 3600
LogExpireInterval = 0

# Crash handling
MailTo = root@localhost
MailAlarmsTo = root@localhost
MailSubjectPrefix = [Zeek]
MailConnectionSummary = 1
MinDiskSpace = 5
MailHostUpDown = 1

# Performance
PFRINGClusterID = 21
PFRINGClusterType = 4

# Zeek process settings
SitePolicyScripts = local.zeek
SitePolicyPath = /opt/zeek/share/zeek/site

# Capture settings
lb_method = pf_ring
lb_procs = 1

# Debugging
Debug = 0
