# Zeek Node Configuration
# Defines cluster topology and worker distribution

[zeek]
type=standalone
host=localhost
interface=any

# For cluster mode (multi-worker), use configuration like:
# [manager]
# type=manager
# host=localhost
#
# [proxy-1]
# type=proxy
# host=localhost
#
# [worker-1]
# type=worker
# host=localhost
# interface=eth0
# lb_method=pf_ring
# lb_procs=4
#
# [worker-2]
# type=worker
# host=localhost
# interface=eth1
# lb_method=pf_ring
# lb_procs=4
